<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ghazal Jomaa ❤️</title>
<style>
*{box-sizing:border-box}
:root{--pink:#d94b78;--deep:#9e3155;--soft:#fff0f5;--line:#e8b7c8}
html,body{margin:0;min-height:100%;font-family:"Tahoma","Arial",sans-serif}
body{background:linear-gradient(180deg,#ffe7f0,#fff7fa);color:#6d3a4d;overflow-x:hidden;position:relative}
.app{width:100%;max-width:600px;margin:auto;min-height:100vh;padding:20px 15px;display:flex;align-items:center;justify-content:center;z-index:10;position:relative}
.card{width:100%;background:rgba(255,255,255,.94);border-radius:30px;padding:25px;box-shadow:0 10px 30px rgba(157,55,91,.1);text-align:center}
.logo{font-size:50px;margin-bottom:10px}
h1{margin:0;color:#74384e;font-size:30px}
h2{color:#a33458;font-size:24px;margin-bottom:20px}
.btn{border:0;border-radius:50px;background:var(--pink);color:#fff;padding:15px 30px;font-size:18px;font-weight:bold;cursor:pointer;width:100%;margin-top:10px}
.btn.secondary{background:#fff;color:var(--deep);border:2px solid var(--line)}
.option{display:block;width:100%;margin:10px 0;padding:15px;border-radius:15px;border:2px solid var(--line);background:#fff;font-size:18px;font-weight:bold;cursor:pointer}
.option.correct{background:#42a36a;color:#fff;border-color:#42a36a}
.option.wrong{background:#d84b5d;color:#fff;border-color:#d84b5d}
.feedback-msg{font-size:20px;font-weight:bold;margin:15px 0;height:30px}
.memory img{width:100%;height:350px;object-fit:cover;border-radius:20px;background:#eee;cursor:pointer;transition:transform 0.3s}
.memory img:hover{transform:scale(1.02)}

/* تصميم القلوب المتطايرة في الخلفية */
.heart {
    position: absolute;
    color: #e91e63;
    font-size: 22px;
    animation: fly 4s linear infinite;
    z-index: 1;
    pointer-events: none;
}
@keyframes fly {
    0% { transform: translateY(100vh) scale(0); opacity: 1; }
    100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
}
</style>
</head>
<body>

<!-- القلوب المتطايرة -->
<div class="heart" style="left: 10%; animation-duration: 3s;">❤️</div>
<div class="heart" style="left: 30%; animation-duration: 5s;">💖</div>
<div class="heart" style="left: 50%; animation-duration: 4s;">❤️</div>
<div class="heart" style="left: 70%; animation-duration: 6s;">💕</div>
<div class="heart" style="left: 90%; animation-duration: 3.5s;">❤️</div>

<audio id="bgMusic" src="song.mp3" loop></audio>

<div class="app"><main id="root"></main></div>

<script>
const photos = [
 {src:"photo1.jpg", caption:"أحلى الذكريات ❤️"},
 {src:"photo2.jpg", caption:"تفاصيل صغيرة بس بتعنيلي كتير 🥹"},
 {src:"photo3.jpg", caption:"لحظة من اللحظات اللي ما بتننسى ❤️"},
 {src:"photo4.jpg", caption:"والمشوار الحلو لسه بأوله 😚"}
];

const questions = [
 {q:"ايمت أول مرة جبتلك وردة؟ 🌹", options:["2025 😌","2024 🫂"], correct:0},
 {q:"ايمت عيد ميلادي؟ 🎂", options:["21/7/2003 🤔","21/9/2003 😂"], correct:0},
 {q:"بتحبيني؟ 🥹", options:["اي 🥹","لا 😡"], correct:0},
 {q:"مرتاحه معي؟ ❤️", options:["اي 😚","لا 🥺💔"], correct:0},
 {q:"تتوقعي ح كون الزوج المثالي؟ 😌", options:["اي 😌","برضو اي 🙂"], correct:0},
 {q:"بحبك؟ ❤️‍🔥", options:["اي 😉","عدد كل شي بالدنيا ❤️‍🔥😚😂"], correct:1}
];

let screen="password", memory=0, q=0, score=0, answers={};

function render(){
 const root=document.getElementById("root");
 let out="";
 if(screen==="password"){
   out=`<div class="card"><div class="logo">🔐❤️</div><h1>عندي إلك شغلة صغيرة...</h1><p>اكتبي كلمة السر لتفتحيها 🫣</p><input id="pw" type="password" style="width:100%;padding:15px;border-radius:10px;border:1px solid #ccc;text-align:center" placeholder="كلمة السر"><div id="err" style="color:red;margin:10px"></div><button class="btn" onclick="checkPassword()">دخول ❤️</button></div>`;
 } else if(screen==="intro"){
   out=`<div class="card"><h1>24/9/2023</h1><p>من هون بلشت حكاية إلها مكان خاص بقلبي...</p><button class="btn" onclick="screen='memory';render()">Next ❤️</button></div>`;
 } else if(screen==="memory"){
   const p=photos[memory];
   out=`<div class="card">
     <div class="memory">
       <img src="${p.src}" alt="memory" ondblclick="nextMemory()" title="انقري مرتين للتنتقلي للبعدها">
       <p>${p.caption} <br><span style="font-size: 12px; color: #888;">(فيكِ تكبيس زر التالي، أو انقري مرتين على الصورة ✨)</span></p>
     </div>
     <div style="display:flex;gap:5px">
       <button class="btn secondary" onclick="prevMemory()">السابق</button>
       <button class="btn" onclick="nextMemory()">التالي</button>
     </div>
   </div>`;
 } else if(screen==="quiz"){
   const item=questions[q], selected=answers[q];
   let fb = selected !== undefined ? (selected===item.correct ? "برافووو يا كوووتتي 🥰" : "بدي نتفككك😡") : "";
   out=`<div class="card"><h2>${item.q}</h2>${item.options.map((x,i)=>{
     let cls = selected===undefined ? "" : (i===item.correct ? "correct" : (i===selected ? "wrong" : ""));
     return `<button class="option ${cls}" onclick="answer(${i})">${x}</button>`;
   }).join("")}<div class="feedback-msg">${fb}</div>${selected!==undefined ? `<button class="btn" onclick="nextQuestion()">السؤال التالي ❤️</button>` : "" }</div>`;
 } else if(screen==="result"){
   out=`<div class="card"><h1>خلصنا الأسئلة 🥹❤️</h1><p>نتيجتك ${score} / ${questions.length}</p><button class="btn" onclick="screen='message';render()">قراءة الرسالة ❤️</button></div>`;
 } else if(screen="message"){
   out=`<div class="card" style="max-height: 80vh; overflow-y: auto; text-align: right;">
     <h2 style="text-align: center;">غزلايتي ❤️</h2>
     <p style="font-size: 14px; color: #444; line-height: 1.8; white-space: pre-line;">
يمكن ما بعرف كل مرة عبّرلك بالكلام عن قديش أنا فخور فيكي، بس والله إنتِ من أكتر الناس اللي بفتخر فيهن بحياتي. فخور فيكي بكل خطوة عم تخطيها، بكل تعب تحملتيه، وبكل مرة وقفتي فيها على رجليكي رغم كل شي كان ممكن يكسرك.
وفخور أكتر إني شايفك عم تكبري قدامي، وعم تصيري أقوى وأوعى وأجمل من جوّا قبل برا. 🥹❤️

وجودك بحياتي مو شي عادي بالنسبة إلي… إنتِ إنسانة إلها مكان خاص بقلبي، وأنا فعلًا بفتخر لما قول إنك غزلايتي، وبفتخر إني واقف حدك وعم شوف تفاصيلك وأيامك ونجاحاتك.

وبدي تعرفي شغلة… أنا مو بس فخور فيكي لما تنجحي أو لما تعملي شي كبير، أنا فخور فيكي حتى بأيامك الصعبة، حتى لما تتعبي، وحتى لما ما تكوني بأفضل حالاتك. لأنك إنتِ، بكل حالاتك، بتستاهلي حدا يضل يقولك: "أنا شايف تعبك، وأنا فخور فيكي." ❤️

وإذا في شي بتمنى يضل بيناتنا، فهو إني كون الشخص اللي لما تلتفتي عليه بأي وقت، تلاقيه عم يبتسم ويقول:
"هاي غزلايتي… وأنا فخور فيها أكتر مما بتتخيل." 🥹❤️

وإذا كان إلنا نصيب نكمل حياتنا سوا، بوعدك إني رح حاول بكل ما بقدر خليكي تعيشي أحلى عيشة معي… عيشة مليانة حب وحنان واهتمام وأمان، وتشوفي مني كل شي بيخليكي تحسي إنك اخترتي الشخص الصح. رح ضل واقف حدك، أفرح لفرحك، وأكون سندك بأيامك الصعبة قبل الحلوة. ❤️

وإذا ما كان إلنا نصيب بالنهاية، فصدقيني رح تظلي من أحلى الذكريات بحياتي… الذكرى اللي مهما مرّ الوقت، رح ابتسم لما أتذكرها، ورح يضل إلها مكان خاص بقلبي. لأن وجودك بحياتي كان شي جميل، وأنا رح أضل فخور إني عشت هالفترة معك، مهما كانت نهايتها. ❤️🥹
     </p>
     <button class="btn" onclick="screen='final';render()">التالي ❤️</button>
   </div>`;
 } else if(screen==="final"){
   out=`<div class="card">
     <h1 style="font-size: 28px; margin: 40px 0; color: #ad1457;">(بحبك بنووتي) 🙆🏻‍♂️🥹</h1>
     <button class="btn secondary" onclick="location.reload()">من الأول 🔄</button>
   </div>`;
 }
 root.innerHTML=out;
}

function checkPassword(){
 if(document.getElementById("pw").value==="Ghazal jomaa"){
   document.getElementById("bgMusic").play();
   screen="intro"; render();
 } else document.getElementById("err").textContent="كلمة السر غلط 😭";
}
function nextMemory(){ memory<photos.length-1 ? (memory++, render()) : (screen="quiz", render()); }
function prevMemory(){ if(memory>0) {memory--; render()} }
function answer(i){ if(answers[q]===undefined) {answers[q]=i; if(i===questions[q].correct) score++; render()} }
function nextQuestion(){ q<questions.length-1 ? (q++, render()) : (screen="result", render()); }
render();
</script>
</body>
</html>
